name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # mypy runs on core/ only -- see pyproject.toml's [tool.mypy] comment
      # for why domains/ and tests/ aren't checked yet.
      - name: mypy (core/)
        run: uv run mypy core/

  test-unit:
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    env:
      # evidently (imported by core/monitoring/drift_base.py, exercised by
      # tests/test_drift_base.py) pulls in nltk transitively. NLTK 2026's
      # own CWD-import security hook (CWE-427 mitigation) false-positives
      # whenever a project's venv/site-packages live inside the checked-out
      # repo root -- true for GitHub Actions' default checkout layout, not
      # an actual hijack risk here. NLTK ships a documented escape hatch for
      # exactly this case: NLTK_DISABLE_IMPORT_SECURITY=1 (see
      # core/monitoring/drift_base.py's module docstring and decisions.md's
      # M6 entry).
      NLTK_DISABLE_IMPORT_SECURITY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage floor
        # M9-12: 25% is a non-regression tripwire, not a target -- measured
        # coverage on this fast (DB/MLflow-free) suite is ~31% today across
        # core/+domains/. Several core/ modules (conformal.py, explain.py,
        # threshold_selector.py, serving/api_base.py) sit at 0% because
        # they're currently exercised only by the DB/MLflow-dependent
        # integration tests in the retrain-trigger-test job below, which
        # this job's fast suite doesn't run. Raising this meaningfully
        # (60-80%) requires writing new fast unit tests for those modules --
        # out of scope for this fix, tracked as a P1/P2 follow-up.
        run: |
          pytest tests/ -v --ignore=tests/test_api_contract.py \
            --cov=core --cov=domains --cov-report=term-missing --cov-fail-under=25

  drift-check:
    runs-on: ubuntu-latest
    needs: test-unit
    env:
      NLTK_DISABLE_IMPORT_SECURITY: "1"
    services:
      postgres:
        image: postgres:16
        env:
          # Mirrors the PharmaPulse Postgres instance this project normally
          # targets (see .env.example) -- same db/user names, a throwaway
          # CI-only password (not a real secret).
          POSTGRES_DB: pharmapulse
          POSTGRES_USER: pharmapulse_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U pharmapulse_user -d pharmapulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install uv
        # This project's Makefile targets (db-init, drift) invoke `uv run`
        # directly (per CLAUDE.md: "Use uv add for all dependency
        # management, never pip install") -- installing uv here lets CI run
        # the exact same `make db-init` / `make drift` commands a developer
        # would run locally, instead of a parallel CI-only command path
        # that could drift out of sync with the Makefile.
        run: pip install uv

      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: Create .env for CI
        # This project's Makefile does `include .env` unconditionally, and
        # domains/pharma/dataset_builder.py reads POSTGRES_* via
        # os.environ[...] (see config.yaml's db.host_env/port_env/... keys)
        # -- both need a real .env file to exist, which is gitignored and
        # never committed. Values here match the postgres service container
        # above and .env.example's documented shape exactly.
        run: |
          cat > .env <<EOF
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5433
          POSTGRES_DB=pharmapulse
          POSTGRES_USER=pharmapulse_user
          POSTGRES_PASSWORD=ci_password
          MLFLOW_TRACKING_URI=file:./mlruns
          EOF

      - name: Initialize ml schema (make db-init)
        run: make db-init

      - name: Seed synthetic training_dataset fixture
        run: |
          psql "host=localhost port=5433 dbname=pharmapulse user=pharmapulse_user password=ci_password" \
            -f tests/fixtures/seed_training_data.sql

      - name: Run drift job (make drift)
        # IMPORTANT DISTINCTION: this validates that the drift job runs
        # end-to-end against a real Postgres instance -- loads reference +
        # current batches, runs Evidently, writes an HTML report, logs a
        # row to ml.drift_log -- without erroring. It does NOT validate that
        # the drift verdict itself is meaningful. tests/fixtures/seed_training_data.sql
        # is 50 synthetic rows with no genuine feature-distribution shift
        # deliberately engineered between its 'train' and 'test' rows, so
        # Evidently will not (and is not expected to) flag real drift on
        # this fixture. Only the job's plumbing is under test here -- see
        # that fixture file's own header comment.
        run: make drift

      - name: Upload drift report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/*.html

  retrain-trigger-test:
    runs-on: ubuntu-latest
    needs: drift-check
    env:
      NLTK_DISABLE_IMPORT_SECURITY: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pharmapulse
          POSTGRES_USER: pharmapulse_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U pharmapulse_user -d pharmapulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (uv.lock)
        run: uv sync --frozen

      - name: Create .env for CI
        run: |
          cat > .env <<EOF
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5433
          POSTGRES_DB=pharmapulse
          POSTGRES_USER=pharmapulse_user
          POSTGRES_PASSWORD=ci_password
          MLFLOW_TRACKING_URI=file:./mlruns
          EOF

      - name: Initialize ml schema (make db-init)
        run: make db-init

      - name: Run M7 retrain-trigger / version-mismatch / rollback tests
        # M9-2: `uv sync --frozen` above installs into an isolated .venv/,
        # not onto PATH -- a bare `pytest` here would resolve to whatever
        # (if anything) happens to be installed system-wide, not the
        # project's pinned dependencies. `uv run` is required, matching the
        # Makefile's own convention (every target invokes `uv run python
        # ...` internally) and CLAUDE.md's standing rule.
        run: |
          uv run pytest tests/test_retrain_trigger.py tests/test_version_mismatch.py \
            tests/test_rollback.py -v --junitxml=m7-results.xml

      - name: Warn if all M7 tests were skipped
        # M9-2 (review section 2.1). Two things are true at once here, and
        # this step is deliberately shaped around both:
        #
        # 1. tests/conftest.py's real_dev_state fixture skips these three
        #    tests when this CI runner lacks a registered Production model
        #    and a marts-backed raw-feature cache. CI's ephemeral Postgres
        #    only ever gets the `ml` schema (via `make db-init`), never
        #    `marts` -- building a synthetic marts fixture (and a way to
        #    bootstrap a fixture Production registration without
        #    register_model.py's real-data reproducibility assertion) was
        #    explicitly considered and deferred as scope beyond M7's actual
        #    ask (see decisions.md's M7 entry). So on THIS CI setup, as it
        #    exists today, all three tests skipping is the CORRECT, expected
        #    outcome, not a bug -- a hard failure here would make this job
        #    permanently red for a known, already-approved scope decision,
        #    which is a worse failure mode than the one being fixed.
        # 2. What the pre-M9 bug actually did wrong wasn't "skips in CI" --
        #    it's that the skip was INVISIBLE. The job reported plain green,
        #    identical to a run that had genuinely exercised M7's retrain/
        #    rollback machinery. That's the false-confidence problem.
        #
        # So: `continue-on-error: true` on this step means an all-skipped
        # run shows a visible yellow warning in the Actions UI on every run
        # (impossible to mistake for "tests genuinely passed") without
        # turning the whole pipeline red for a documented, deferred-scope
        # limitation. If the marts fixture is ever built and these tests
        # start running for real in CI, this step passes silently like any
        # other -- no further change needed here.
        continue-on-error: true
        run: |
          uv run python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('m7-results.xml').getroot()
          skipped = int(root.attrib.get('skipped', 0))
          total = int(root.attrib.get('tests', 0))
          assert total > 0, 'No M7 tests collected'
          assert skipped < total, (
              f'All {total} M7 tests skipped -- this CI runner has no marts schema or '
              'registered Production model (deferred scope, see decisions.md M7 entry), '
              'so this job is not asserting any real M7 behavior right now. Not failing '
              'the build for a known limitation, but this warning exists so that fact '
              'stays visible instead of silently reading as a normal pass.'
          )
          "
