# TrialOutcome (pharma domain) -- dataset build config for M1/M2.
# All pharma-specific decisions live here per Section 0 core/ vs domains/pharma/ split.

db:
  # Values pulled from environment at runtime (see .env.example) -- never hardcode
  # real credentials here. host/port/db/user/password read from POSTGRES_* env vars.
  host_env: POSTGRES_HOST
  port_env: POSTGRES_PORT
  dbname_env: POSTGRES_DB
  user_env: POSTGRES_USER
  password_env: POSTGRES_PASSWORD
  read_schema: marts
  write_schema: ml

# --- Label definition -----------------------------------------------------
# DECISION (2026-07-30, confirmed with user): marts.fct_trials.is_terminated is
# NOT used directly -- it is TRUE only for overall_status = 'TERMINATED' and is
# FALSE for WITHDRAWN/SUSPENDED, which contradicts the spec's documented label
# definition and would silently mislabel ~4,449 WITHDRAWN/SUSPENDED trials as
# successes. The label is derived from overall_status instead. This raises the
# positive rate from 14.3% (mart column) to 19.9% (derived), consistent with
# the spec's expected ~20-25% positive rate.
label:
  positive_statuses: [TERMINATED, WITHDRAWN, SUSPENDED]
  negative_statuses: [COMPLETED]

# --- Row filters -----------------------------------------------------------
filters:
  # Interventional Phase 2/3 trials only. There is no separate `interventional`
  # flag in marts.fct_trials -- phase itself is only assigned to interventional
  # studies in the CT.gov taxonomy, so filtering to these phase values already
  # excludes observational studies.
  phase_in: [PHASE2, PHASE3, "PHASE2|PHASE3"]
  overall_status_in: [COMPLETED, TERMINATED, WITHDRAWN, SUSPENDED]
  # DECISION (2026-07-30, confirmed with user): drop rows with implausible
  # start_date rather than let them fall into an arbitrary split bucket. 222 of
  # 79,334 label-eligible rows (~0.3%) had start_date < 1990-01-01 (data-entry
  # defaults going back to 1900-01-01) or start_date in the future for a trial
  # already marked COMPLETED/TERMINATED/WITHDRAWN/SUSPENDED (logically
  # impossible -- can't finish before it starts).
  start_date_min: "1990-01-01"
  start_date_max: today  # resolved to CURRENT_DATE at build time

# --- Temporal split (locked dates) -----------------------------------------
split:
  train_end: "2020-01-01"      # start_date <  2020-01-01            -> train
  calib_end: "2022-01-01"      # 2020-01-01 <= start_date < 2022-01-01 -> calib
                                 # start_date >= 2022-01-01            -> test
  random_state: 42              # for the contrast random split (same proportions)

# --- Feature groups ----------------------------------------------------------
# DECISION (2026-07-30, confirmed with user): live marts.fct_trials has
# allocation, masking, has_dmc, and eligibility_criteria columns that the
# original requirements listed as unavailable (stale check). Only num_arms is
# genuinely absent. These four are included as real features -- see
# dropped_features below for the one column still missing.
features:
  design:
    - phase                    # categorical
    # enrollment_count REMOVED in M9 -- target leakage, see dropped_features.
    - num_primary_outcomes
    - num_sites
    - has_results               # verified non-leaky: 1,228 RECRUITING/ACTIVE_NOT_RECRUITING
                                 # trials already have has_results=true in the live mart
                                 # (see notebooks/01_dataset_audit.ipynb section 4), so it is
                                 # populated at/before trial start for a meaningful share of
                                 # trials, not exclusively post-completion.
    - allocation                # categorical: RANDOMIZED / NON_RANDOMIZED / NA / unknown
    - masking                   # categorical: NONE / SINGLE / DOUBLE / TRIPLE / QUADRUPLE / unknown
    - has_dmc                   # boolean, ~21.6% null -> tri-state categorical (true/false/unknown)
  text_lite:
    - eligibility_criteria_length   # word count of eligibility_criteria
    - exclusion_keyword_count       # bullet/numbered items after "Exclusion Criteria" header
  sponsor_history:
    - sponsor_prior_trial_count       # point-in-time self-join, see dataset_builder.py
    - sponsor_prior_termination_rate  # point-in-time self-join, see dataset_builder.py
    - sponsor_class                    # from dim_sponsor -- static attribute, no leakage risk
  condition:
    - condition_name             # one-hot top-N + 'other' + 'unknown'
    - condition_rarity           # point-in-time count of prior trials sharing the primary condition
  temporal:
    - start_year
    - start_quarter

condition_one_hot:
  top_n: 20   # marts.dim_condition has 131,999 distinct condition_name values (long tail)
              # -- top 20 + 'other' + 'unknown' keeps the encoding tractable.

# --- Dropped features --------------------------------------------------------
# Logged per-column with reason. Re-verify against marts.fct_trials schema
# before assuming this list is still accurate -- it has drifted from the
# original spec once already (see label/features DECISION notes above).
dropped_features:
  - name: num_arms
    reason: "not in mart -- confirmed absent from marts.fct_trials (2026-07-30)"
  # --- M9-1 (2026-08-03) ------------------------------------------------------
  # Target leakage. WITHDRAWN means "stopped before enrolling the first
  # participant," so actual enrollment is 0 BY DEFINITION of the label class:
  # P(label=1 | enrollment_count == 0) = 0.981 overall and 1.000 on TEST, and
  # 3,994/3,994 WITHDRAWN trials with enrollment_type='ACTUAL' have
  # enrollment_count = 0. A single `if enrollment == 0` rule scores 0.632
  # PR-AUC on TEST -- within 0.017 of the whole pipeline minus enrollment.
  # Ablation: full 0.888 -> without enrollment 0.648 (~40% of total lift over
  # the 0.317 baseline came from a column encoding the label).
  - name: enrollment_count
    reason: >-
      target leakage -- WITHDRAWN is definitionally a zero-enrollment status,
      so the feature encodes the label class. Removed in M9 along with its
      log1p transform and missingness indicator. See review section 1.1 and
      decisions.md M9-1.
  - name: log_enrollment_count
    reason: "derived from enrollment_count -- removed with it in M9 (see above)"
  - name: enrollment_missing
    reason: >-
      missingness indicator for enrollment_count. Removed in M9 not merely as
      a dependent of the dropped column but on its own evidence: under the
      review's fix path A (keep enrollment only where enrollment_type =
      'ESTIMATED') this indicator becomes a proxy for enrollment_type !=
      'ESTIMATED', which is itself post-hoc -- every trial's enrollment record
      reads ESTIMATED at registration and only becomes ACTUAL once the trial
      reports. Measured: the indicator ALONE, carrying no enrollment magnitude,
      supplies +0.0288 of path A's +0.0337 PR-AUC lift over path B. See
      decisions.md M9-1 for the decomposition table.

# --- Missingness policy -------------------------------------------------------
# Null rates printed to stdout at build time (see PharmaDatasetBuilder.build_features).
# M9-21: re-measured against data/raw_trials_cache.parquet's CURRENT n=78,260
# (the M9-11 rebuild's row count -- see decisions.md M9-11) -- the n=79,334
# baseline these rates were originally computed against (2026-07-30, before
# M9-1's enrollment_count removal and M9-11's sponsor-history rebuild both
# changed which rows the cache contains) had drifted stale. Recomputed
# directly against the parquet cache, not estimated by rescaling the old
# ratios.
missingness_policy:
  # enrollment_count's policy (impute_median + enrollment_missing indicator)
  # was removed in M9 -- the column is no longer a feature. See
  # dropped_features above.
  num_primary_outcomes:
    null_rate_observed: 0.0350   # 2,737 / 78,260
    strategy: impute_median
  num_sites:
    null_rate_observed: 0.0841   # 6,584 / 78,260
    strategy: impute_median
  allocation:
    null_rate_observed: 0.0219   # 1,715 / 78,260 (NULL or blank)
    strategy: sentinel
    sentinel_value: unknown
  masking:
    null_rate_observed: 0.0231   # 1,811 / 78,260 (NULL or blank)
    strategy: sentinel
    sentinel_value: unknown
  has_dmc:
    null_rate_observed: 0.2076   # 16,248 / 78,260
    strategy: sentinel           # tri-state categorical, NOT imputed to a mode --
                                  # ~21% null is too high to collapse into true/false
    sentinel_value: unknown
  eligibility_criteria:
    null_rate_observed: 0.0002   # 18 / 78,260
    strategy: impute_empty_string   # -> criteria_length=0, exclusion_keyword_count=0
  sponsor_prior_termination_rate:
    strategy: impute_median      # NULL for sponsors with no prior trials (new sponsors)
  sponsor_prior_trial_count:
    strategy: impute_zero        # NOT median -- new sponsors genuinely have 0 prior trials
  condition_name:
    strategy: sentinel
    sentinel_value: unknown
  sponsor_class:
    strategy: sentinel
    sentinel_value: unknown
  phase:
    strategy: drop_row           # phase is the primary filter -- NULL phase is unclassifiable

# --- M3 threshold decision (SUPERSEDED BY M9 -- see below) -------------------
# The original M3 value (0.22) was selected by sweeping the 5:1 FN:FP cost
# ratio against the TEST split and then reporting metrics at that same
# threshold on TEST. The M9 review (section 1.2) correctly identified this as a
# one-parameter fit on the evaluation split, not a "reporting step." Superseded
# below. Kept as a comment for provenance, not as a live value.
#
# --- M9 threshold decision ---------------------------------------------------
# DECISION (M9-4, 2026-08-03, updated M9-11): SELECTED ON CALIB, REPORTED ON
# TEST. Swept against domains/pharma/cost_matrix.yaml's 5:1 FN:FP ratio using
# the M9-11 model's isotonic-calibrated probabilities (M9-11 rebuilt the
# dataset with sponsor_prior_termination_rate's point-in-time fix and
# retrained the champion again -- see decisions.md M9-11 -- so this threshold
# moved a second time along with the model it's calibrated against).
#
# INSTABILITY CHECK (re-run under M9-11): the M9 fix plan's ~0.05 stability
# margin did NOT fire this time -- CALIB (0.16) and TEST-reference (0.21)
# differ by exactly 0.05, which the same ">0.05" rule that fired under M9-4
# (CALIB 0.14 vs TEST 0.22, |diff|=0.08) classifies as stable here. The
# bootstrap was still run for continuity with M9-4's own reporting discipline
# (report the interval regardless, not just when the contingency fires):
#   * 1,000-resample bootstrap of the CALIB selection: 95% CI = [0.13, 0.21],
#     median 0.16. TEST-reference (0.21) now falls INSIDE this CI -- under
#     M9-4 it fell outside [0.10, 0.20].
#   * Regret from selecting honestly (CALIB) vs the unattainable TEST-optimal
#     (0.21): cost 3,326 vs 3,235 on TEST -- 2.8%, down from M9-4's 3.7%.
# Interpretation: the M9-11 sponsor-history fix didn't just change the
# feature's values, it also made the CALIB- and TEST-split cost surfaces
# agree more closely -- consistent with removing a source of noise
# (future-known status leaking into a feature) rather than adding one.
#
# OPERATIONAL CAVEAT: at 0.16 the model flags 72.9% of trials that actually
# complete. That is what a 5:1 FN:FP matrix asks for given this model's
# current discriminative power -- it is a triage filter, not an automated
# decision gate. Named here rather than buried.
model:
  threshold_decision:
    value: 0.16
    method: cost_optimal
    selected_on: calib          # M9-4: the fit split
    reported_on: test           # M9-4: the evaluation split
    bootstrap_ci_95: [0.13, 0.21]   # 1,000 resamples of the CALIB selection (M9-11)
    test_would_have_selected: 0.21  # reference only -- NOT used, this is the biased choice
    regret_vs_test_optimal_pct: 2.8
    expected_cost_at_threshold: 3326.0   # FN_count*5 + FP_count*1, TEST split (n=5789)
    recall_at_threshold: 0.952   # catches 95.2% of trials that actually terminate
    fp_rate_at_threshold: 0.729  # 72.9% false-positive rate among trials that actually complete
    precision_at_threshold: 0.375
    f1_at_threshold: 0.538
    calibration_method: isotonic
    computed_in: notebooks/03_calibration.ipynb

# --- M6 drift monitoring ------------------------------------------------------
# DECISION (2026-08-02): reference = ml.training_dataset WHERE split='train'
# (the population the Production model was actually trained on); current =
# WHERE split='test' -- a PROXY for "last week's newly-scored trials" per the
# M6 requirements, since no live scoring traffic exists yet (the API has never been
# called in production). Documented honestly in domains/pharma/monitoring/drift_job.py,
# notebooks/06_drift_report.ipynb, and README.md rather than presented as real
# production monitoring data.
drift:
  reference_split: train
  current_split: test
  feature_drift_threshold: 0.5   # fraction of features drifted = alert
  dataset_drift: true            # use Evidently's dataset-level drift flag (DriftedColumnsCount share vs feature_drift_threshold above)
